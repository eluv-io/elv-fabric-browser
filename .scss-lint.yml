files:
  include: "src/static/stylesheets/*.scss"
  ignore:
    - "src/static/stylesheets/fonts.scss"
    - "src/static/stylesheets/color-scheme.scss"
rules:
  class-name-format:
  - 2
  - convention: hyphenatedlowercase
  leading-zero:
  - 0
  quotes:
  - 1
  - style: double
  nesting-depth:
  - 1
  - max-depth: 3


